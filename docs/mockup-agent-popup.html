<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Family Agent · 消息界面（MD3）</title>
<style>
  /* 按 PopupWindow.xaml 1:1 复刻（Material Design 3 暗色）。真实 PC 端由 WPF 渲染。 */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --surface:#141218; --surface-low:#1D1B20; --surface-c:#211F26;
    --surface-high:#2B2930; --surface-highest:#36343B;
    --on-surface:#E6E0E9; --on-variant:#CAC4D0;
    --outline:#938F99; --outline-variant:#49454F;
    --primary:#A8C7FA; --primary-c:#0842A0; --on-primary-c:#D3E3FD; --on-primary:#0B1020;
    --ok:#A5D6A7; --bad:#EF9A9A;
  }
  body{width:1920px;height:1080px;overflow:hidden;display:flex;flex-direction:column;
       font-family:Roboto,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
       background:var(--surface);color:var(--on-surface);-webkit-font-smoothing:antialiased}

  /* ── 顶部应用栏 ── */
  .appbar{height:64px;flex:0 0 64px;display:flex;align-items:center;
          background:var(--surface-low);border-bottom:1px solid var(--outline-variant);
          padding:0 32px 0 56px}
  .appbar .title{font-size:22px;font-weight:400}
  .appbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
  .stat{font-size:12px;color:var(--on-variant);margin-right:12px}
  .iconbtn{width:40px;height:40px;border-radius:999px;display:flex;
           align-items:center;justify-content:center;color:var(--on-variant)}

  /* ── 消息区（右侧弹幕已移除）── */
  .thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
          gap:14px;overflow:hidden;padding:20px 40px 0 56px}

  .row{display:flex;align-items:flex-start}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .avatar{width:44px;height:44px;border-radius:50%;flex:0 0 44px;
          display:flex;align-items:center;justify-content:center;
          font-size:19px;font-weight:500;margin:0 12px}

  .bubble{padding:12px 18px 10px;max-width:660px;border-radius:16px}
  .row.in  .bubble{border-top-left-radius:4px;  border-left:3px solid var(--nick)}
  .row.out .bubble{border-top-right-radius:4px; border-right:3px solid var(--nick)}
  .who{font-size:14px;font-weight:500;color:var(--nick);margin-bottom:4px}
  .msg{color:var(--on-surface);line-height:1.35}
  .at{font-size:12px;color:#8B8695;text-align:right;margin-top:6px}

  /* ── 回复区 ── */
  .replyarea{flex:0 0 auto;padding:20px 40px 32px 56px}
  .replyrow{display:flex;gap:12px;align-items:stretch}
  .combo{display:flex;align-items:center;justify-content:space-between;gap:10px;
         min-width:132px;padding:10px 14px;border-radius:12px;
         background:var(--surface-c);border:1px solid var(--outline);font-size:16px}
  .combo .caret{color:var(--on-variant);font-size:12px}
  .inbox{flex:1;display:flex;align-items:center;padding:14px 18px;border-radius:12px;
         background:var(--surface-c);border:1px solid var(--outline);
         font-size:24px;color:#7d7887}
  .send{display:flex;align-items:center;justify-content:center;padding:0 40px;
        border-radius:999px;background:var(--primary);color:var(--on-primary);
        font-size:20px;font-weight:500}
  .bottom{display:flex;align-items:center;margin-top:18px}
  .ok{display:flex;align-items:center;justify-content:center;height:48px;padding:0 44px;
      border-radius:999px;border:1px solid var(--outline);color:var(--primary);font-size:20px}
  .hint{font-size:16px;color:var(--on-variant);margin-left:20px}
</style>
</head>
<body>

  <div class="appbar">
    <span class="title">家庭消息</span>
    <div class="right">
      <span class="dot"></span>
      <span class="stat">已连接</span>
      <span class="iconbtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      </span>
    </div>
  </div>

  <div class="thread">
    <!-- 妈妈：#90CAF9 蓝 -->
    <div class="row in">
      <div class="avatar" style="background:#2b3746;color:#90CAF9">妈</div>
      <div class="bubble" style="--nick:#90CAF9;background:#1c2530">
        <div class="who">妈妈</div>
        <div class="msg" style="font-size:23px">晚上想吃什么</div>
        <div class="at">18:02</div>
      </div>
    </div>

    <!-- 书房电脑：#A5D6A7 绿 -->
    <div class="row out">
      <div class="bubble" style="--nick:#A5D6A7;background:#1d2721">
        <div class="who">书房电脑</div>
        <div class="msg" style="font-size:23px">随便，你做什么我吃什么</div>
        <div class="at">18:03</div>
      </div>
      <div class="avatar" style="background:#2c3a2e;color:#A5D6A7">书</div>
    </div>

    <!-- 爸爸：#FFCC80 橙 -->
    <div class="row in">
      <div class="avatar" style="background:#3a3125;color:#FFCC80">爸</div>
      <div class="bubble" style="--nick:#FFCC80;background:#26211a">
        <div class="who">爸爸</div>
        <div class="msg" style="font-size:25px">把阳台的衣服收一下</div>
        <div class="at">18:05</div>
      </div>
    </div>

    <!-- 书房电脑 -->
    <div class="row out">
      <div class="bubble" style="--nick:#A5D6A7;background:#1d2721">
        <div class="who">书房电脑</div>
        <div class="msg" style="font-size:25px">好，马上</div>
        <div class="at">18:06</div>
      </div>
      <div class="avatar" style="background:#2c3a2e;color:#A5D6A7">书</div>
    </div>

    <!-- 妈妈 · 最新 -->
    <div class="row in">
      <div class="avatar" style="background:#2b3746;color:#90CAF9">妈</div>
      <div class="bubble" style="--nick:#90CAF9;background:#1c2530">
        <div class="who">妈妈</div>
        <div class="msg" style="font-size:28px">下来吃饭了</div>
        <div class="at">18:12</div>
      </div>
    </div>
  </div>

  <div class="replyarea">
    <div class="replyrow">
      <div class="combo"><span style="color:#A5D6A7">书房电脑</span><span class="caret">▼</span></div>
      <div class="inbox">输入回复内容，按 Enter 发送</div>
      <div class="send">回复</div>
    </div>
    <div class="bottom">
      <div class="ok">关闭窗口</div>
      <div class="hint">Enter 直接回复</div>
    </div>
  </div>

</body>
</html>
