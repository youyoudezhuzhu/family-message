<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141218">
<title>家庭消息 · 控制台</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="ws-dot"></span>
    <h1>家庭消息</h1>
    <span class="sub" id="server-time"></span>
    <span class="sub" id="server-ver" title="当前运行的服务端版本（升级后没变说明旧进程还在跑）"></span>
  </div>
  <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#CAC4D0">
      <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
    </svg>
  </button>
  <button class="icon-btn" id="btn-refresh" title="刷新" aria-label="刷新">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#CAC4D0">
      <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
  </button>
</header>

<main>

  <!-- ── 发送区 ───────────────────────────────── -->
  <section class="card">
    <div class="card-head"><h2>发送消息</h2></div>

    <div class="field">
      <span class="label">发送人</span>
      <div class="md-select" id="sender-sel"></div>
    </div>

    <div class="field">
      <span class="label">发送给</span>
      <div class="targets" id="targets"></div>
    </div>

    <label class="field">
      <span class="label">消息内容</span>
      <textarea id="content" rows="3" placeholder="输入消息，例如：下来吃饭了"></textarea>
    </label>

    <div class="quick" id="quick"></div>

    <div class="actions">
      <button class="btn btn-filled" id="btn-send">发送</button>
      <span class="hint" id="send-hint"></span>
    </div>
  </section>

  <!-- ── 设备 ─────────────────────────────────── -->
  <section class="card">
    <div class="card-head">
      <h2>设备</h2>
      <span class="hint" id="dev-count"></span>
    </div>
    <div class="devices" id="devices"></div>
    <p class="empty" id="dev-empty">还没有设备接入。在 PC 上运行 Family Agent 后会自动出现在这里。</p>
  </section>

  <!-- ── 消息记录 ─────────────────────────────── -->
  <section class="card">
    <div class="card-head">
      <h2>消息记录</h2>
      <button class="btn btn-text small" id="btn-history">加载更早</button>
    </div>
    <div class="log" id="log"></div>
  </section>

</main>

<!-- 截图 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modal-title">桌面截图</strong>
      <button class="btn btn-text small" id="modal-close">关闭</button>
    </div>
    <div class="modal-body"><img id="modal-img" alt="桌面截图"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- 对话 -->
<div class="modal" id="conv">
  <div class="modal-box conv-box">
    <div class="modal-head">
      <strong id="conv-title">对话</strong>
      <span class="hint" id="conv-state"></span>
      <button class="btn btn-text small" id="conv-close">关闭</button>
    </div>
    <div class="conv-body" id="conv-body"></div>
    <div class="conv-input">
      <div class="md-select" id="conv-sender-sel" title="以谁的名义发送"></div>
      <input id="conv-text" placeholder="输入消息，回车发送">
      <button class="btn btn-filled small" id="conv-send">发送</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settings">
  <div class="modal-box names-box">
    <div class="modal-head">
      <strong>设置</strong>
      <button class="btn btn-text small" id="settings-close">关闭</button>
    </div>
    <div class="names-body">
      <span class="section-label">配色方案</span>
      <div class="theme-grid" id="theme-grid"></div>

      <hr class="divider">

      <span class="section-label">发送昵称</span>
      <div class="names-add">
        <input id="name-new" placeholder="输入新昵称，回车添加" maxlength="16">
        <button class="btn btn-filled small" id="name-add">添加</button>
      </div>
      <div id="names-list"></div>

      <p class="hint" style="margin-top:14px; line-height:1.6">
        配色和昵称都只保存在<strong>这台设备的浏览器</strong>里（localStorage），服务端不记录。
        同一个昵称就当作同一个人 —— 消息颜色也按昵称分配，换浏览器要重新设置。
      </p>
    </div>
  </div>
</div>

<script src="static/app.js"></script>
</body>
</html>
