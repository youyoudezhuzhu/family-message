<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>家庭消息 · 连不上服务端</title>
<!-- ═══════════════════════════════════════════════════════════════════
     壳的本地兜底页（随 exe 打包，不经服务端）

     什么时候看到这一页：还没配置服务端地址，或者服务端连不上。
     这一页**不能依赖服务端资源**（它就是因为连不上才出现的），所以样式、图标全内联；
     颜色是 tokens.css 里 Fluent 2 令牌的副本，明暗跟随系统。

     两个动作都走壳的桥（window.chrome.webview.postMessage）：
       保存并重试 → {"type":"web.set_server","url":"…","enroll_token":"…"}
       退出       → {"type":"web.quit"}
     页面不自己连服务端 —— 保存完由壳去重试，成功就把窗口换到正式页面。

     可选查询参数（宿主给页面预填）：
       ?server=http://192.168.31.50:18801   服务端地址
       ?token=family-2026                   设备注册口令
       ?reason=connection refused           连不上的原因（原样显示给用户看）
     ═══════════════════════════════════════════════════════════════════ -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #F3F3F3; --card: #FFFFFF; --surface2: #FAFAFA; --text: #1A1A1A;
    --text2: #5C5C5C; --text3: #8A8A8A; --border: #D6D6D6; --border-strong: #B3B3B3;
    --card-stroke: #E5E5E5; --primary: #0F6CBD; --primary-hover: #115EA3;
    --on-primary: #FFFFFF; --tint: #EFF6FC; --warning: #9D5D00; --warning-tint: #FDF3D7;
    --error: #C42B1C; --success: #0F7B0F;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 2px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202020; --card: #2B2B2B; --surface2: #272727; --text: #FFFFFF;
      --text2: #C5C5C5; --text3: #9E9E9E; --border: #4D4D4D; --border-strong: #6B6B6B;
      --card-stroke: #3D3D3D; --primary: #479EF5; --primary-hover: #0F6CBD;
      --on-primary: #FFFFFF; --tint: #12314A; --warning: #FCE100; --warning-tint: #433519;
      --error: #FF99A4; --success: #6CCB5F;
      --shadow: 0 1px 2px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
      --shadow-lg: 0 8px 16px rgba(0,0,0,.42), 0 0 2px rgba(0,0,0,.34);
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 14px/20px "Segoe UI Variable", "Segoe UI", system-ui,
          "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 520px;
    display: flex; flex-direction: column; gap: 12px;
    padding: 24px;
    background: var(--card);
    border: 1px solid var(--card-stroke);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 40px; height: 40px; flex: 0 0 40px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    background: var(--warning-tint); color: var(--warning);
  }
  .mark svg { width: 22px; height: 22px; fill: currentColor; }
  h1 { margin: 0; font: 600 20px/28px inherit; }
  .sub { margin: 0; color: var(--text2); font-size: 12px; line-height: 1.7; }
  .reason {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 12px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--card-stroke);
    color: var(--text2); font-size: 12px; line-height: 1.6;
    word-break: break-word;
  }
  .reason svg { width: 14px; height: 14px; flex: 0 0 14px; margin-top: 2px; fill: currentColor; }
  label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--text2); }
  input {
    width: 100%; height: 34px; padding: 8px 12px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-bottom-color: var(--border-strong);
    border-radius: 6px; font: inherit; outline: none;
  }
  input:focus { border-color: var(--primary); border-bottom-width: 2px; }
  .support { display: block; margin-top: 4px; font-size: 12px; color: var(--text3); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .row .spacer { flex: 1; }
  button {
    height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid transparent;
    font: 600 14px/20px inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  button svg { width: 16px; height: 16px; fill: currentColor; }
  .primary { background: var(--primary); color: var(--on-primary); }
  .primary:hover:not(:disabled) { background: var(--primary-hover); }
  .secondary { background: transparent; border-color: var(--border); color: var(--text); }
  .secondary:hover:not(:disabled) { background: var(--surface2); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .hint { min-height: 16px; font-size: 12px; color: var(--text2); }
  .hint.ok { color: var(--success); }
  .hint.err { color: var(--error); }
  .foot { border-top: 1px solid var(--card-stroke); padding-top: 12px; font-size: 12px; color: var(--text3); line-height: 1.7; }
  .foot code { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="mark" aria-hidden="true">
        <!-- Fluent System Icons · Warning 24 Regular -->
        <svg viewBox="0 0 24 24"><path d="M9.13848 3.70711C10.3664 1.43126 13.6315 1.43104 14.8592 3.70711L21.6024 16.209C22.7697 18.374 21.2016 21.0014 18.742 21.002H5.25469C2.79486 21.0017 1.22681 18.3742 2.39433 16.209L9.13848 3.70711ZM13.5389 4.41902C12.8779 3.1935 11.119 3.19371 10.4578 4.41902L3.71464 16.921C3.08599 18.0867 3.93027 19.5017 5.25469 19.502H18.742C20.0661 19.5014 20.9105 18.0866 20.2821 16.921L13.5389 4.41902ZM11.9998 15.0001C12.5521 15.0001 12.9998 15.4478 12.9998 16.0001C12.9998 16.5523 12.5521 17.0001 11.9998 17.0001C11.4477 16.9999 10.9999 16.5522 10.9998 16.0001C10.9998 15.4479 11.4476 15.0002 11.9998 15.0001ZM11.9998 7.50007C12.414 7.50007 12.7498 7.83586 12.7498 8.25007V12.7501C12.7498 13.1642 12.414 13.5001 11.9998 13.5001C11.5857 13.4999 11.2499 13.1642 11.2498 12.7501V8.25007C11.2498 7.83593 11.5857 7.5002 11.9998 7.50007Z"/></svg>
      </span>
      <div>
        <h1>连不上服务器</h1>
        <p class="sub">填好服务端地址与设备注册口令，保存后立刻重试。</p>
      </div>
    </div>

    <div class="reason" id="reason-row">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12.0016 1.99902C17.5253 1.99902 22.0031 6.47687 22.0031 12.0006C22.0031 17.5243 17.5253 22.0021 12.0016 22.0021C6.47785 22.0021 2 17.5243 2 12.0006C2 6.47687 6.47785 1.99902 12.0016 1.99902ZM12.0016 3.49902C7.30627 3.49902 3.5 7.3053 3.5 12.0006C3.5 16.6959 7.30627 20.5021 12.0016 20.5021C16.6968 20.5021 20.5031 16.6959 20.5031 12.0006C20.5031 7.3053 16.6968 3.49902 12.0016 3.49902ZM12 10.5C12.4142 10.5 12.75 10.8358 12.75 11.25V16.25C12.75 16.6642 12.4142 17 12 17C11.5858 17 11.25 16.6642 11.25 16.25V11.25C11.25 10.8358 11.5858 10.5 12 10.5ZM12 9C12.5523 9 13 8.55229 13 8C13 7.44772 12.5523 7 12 7C11.4477 7 11 7.44772 11 8C11 8.55229 11.4477 9 12 9Z"/></svg>
      <span id="reason-text">还没有连上服务端。</span>
    </div>

    <div>
      <label for="url">服务端地址</label>
      <input id="url" type="url" inputmode="url" spellcheck="false"
             placeholder="http://192.168.31.50:18801" autocomplete="off">
      <span class="support">NAS 上那个控制台的地址，含端口；局域网内用 <code>http://</code> 就行。</span>
    </div>

    <div>
      <label for="token">设备注册口令</label>
      <input id="token" type="password" spellcheck="false" autocomplete="off"
             placeholder="服务端 config.yaml 里的 device.enroll_token">
      <span class="support">服务端的 <code>device.enroll_token</code>；留空表示服务端允许内网任意设备自动注册。</span>
    </div>

    <div class="row">
      <span class="hint" id="hint" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button class="secondary" id="quit" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.2042 4.82046C8.57962 4.64545 9.02584 4.80792 9.20085 5.18334C9.37586 5.55876 9.2134 6.00498 8.83797 6.18C6.21382 7.4033 4.5 10.0416 4.5 12.9914C4.5 17.1386 7.85759 20.5002 11.9989 20.5002C16.1403 20.5002 19.4979 17.1386 19.4979 12.9914C19.4979 10.0477 17.7912 7.41389 15.1753 6.18718C14.8002 6.01131 14.6388 5.56472 14.8147 5.1897C14.9905 4.81467 15.4371 4.65322 15.8121 4.82909C18.9502 6.30065 20.9979 9.46066 20.9979 12.9914C20.9979 17.9666 16.9691 22.0002 11.9989 22.0002C7.02876 22.0002 3 17.9666 3 12.9914C3 9.45334 5.05623 6.28796 8.2042 4.82046ZM11.9989 2.49609C12.3786 2.49609 12.6924 2.77825 12.7421 3.14432L12.7489 3.24609V10.746C12.7489 11.1602 12.4132 11.496 11.9989 11.496C11.6192 11.496 11.3055 11.2139 11.2558 10.8478L11.2489 10.746V3.24609C11.2489 2.83188 11.5847 2.49609 11.9989 2.49609Z"/></svg>
        <span>退出</span>
      </button>
      <button class="primary" id="save" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.2506 5.18011C15.9994 5.50947 16.0627 5.9801 16.3921 6.23128C18.1804 7.59515 19.25 9.70821 19.25 12C19.25 15.736 16.4242 18.812 12.7933 19.2071L13.4697 18.5303C13.7626 18.2374 13.7626 17.7626 13.4697 17.4697C13.2034 17.2034 12.7867 17.1792 12.4931 17.3971L12.409 17.4697L10.409 19.4697C10.1427 19.7359 10.1185 20.1526 10.3364 20.4462L10.409 20.5303L12.409 22.5303C12.7019 22.8232 13.1768 22.8232 13.4697 22.5303C13.7359 22.2641 13.7601 21.8474 13.5423 21.5538L13.4697 21.4697L12.7194 20.7208C17.2154 20.355 20.75 16.5903 20.75 12C20.75 9.23526 19.4582 6.68321 17.3017 5.03856C16.9724 4.78738 16.5017 4.85075 16.2506 5.18011ZM10.5303 1.46967C10.2374 1.76256 10.2374 2.23744 10.5303 2.53033L11.2796 3.27923C6.78409 3.6456 3.25 7.41008 3.25 12C3.25 14.6445 4.43126 17.0974 6.43081 18.7491C6.75016 19.0129 7.22289 18.9679 7.48669 18.6485C7.75048 18.3292 7.70545 17.8564 7.3861 17.5926C5.72793 16.2229 4.75 14.1922 4.75 12C4.75 8.26436 7.57532 5.18861 11.2057 4.79301L10.5303 5.46967C10.2374 5.76256 10.2374 6.23744 10.5303 6.53033C10.8232 6.82322 11.2981 6.82322 11.591 6.53033L13.591 4.53033C13.8839 4.23744 13.8839 3.76256 13.591 3.46967L11.591 1.46967C11.2981 1.17678 10.8232 1.17678 10.5303 1.46967Z"/></svg>
        <span>保存并重试</span>
      </button>
    </div>

    <div class="foot" id="foot">
      页面只负责把地址与口令交给程序本体，由它去连接（<code>web.set_server</code>）。
    </div>
  </div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var bridge = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;

  function post(msg) {
    if (bridge) {
      try { bridge.postMessage(msg); } catch (e) { console.warn(e); }
      return;
    }
    console.info('[shell] 没有宿主，消息只打到控制台：', msg);   // 普通浏览器里手测时的兜底
  }

  function setHint(text, kind) {
    var el = $('hint');
    el.textContent = text || '';
    el.className = 'hint' + (kind ? ' ' + kind : '');
  }

  // ── 预填（宿主可以通过查询参数把当前配置带过来）
  var url = params.get('server') || params.get('url') || '';
  var token = params.get('token') || params.get('enroll_token') || '';
  if (url) $('url').value = url;
  if (token) $('token').value = token;

  var reason = params.get('reason');
  if (reason) {
    $('reason-text').textContent = reason;
  } else if (!url) {
    $('reason-text').textContent = '还没有配置服务端地址 —— 第一次运行需要填一次。';
  } else {
    $('reason-text').textContent = '连不上 ' + url + '。确认这台电脑和服务端在同一个局域网、地址和端口没写错。';
  }

  if (!bridge) {
    $('foot').textContent = '（当前不在应用外壳里运行，下面两个按钮不会生效。）';
  }

  // ── 保存并重试：交给壳去连，成功的话这一页会被换掉
  var retryTimer = null;
  $('save').onclick = function () {
    var u = $('url').value.trim();
    if (!u) { setHint('先填服务端地址', 'err'); $('url').focus(); return; }
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
    $('url').value = u;

    setHint('已保存，正在重新连接…', 'ok');
    $('save').disabled = true;
    post({ type: 'web.set_server', url: u, enroll_token: $('token').value.trim() });

    // 连上了这一页就被换掉；还留在这里说明没成功，把按钮放开让用户改
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () {
      $('save').disabled = false;
      setHint('还是没连上：检查地址、端口和注册口令', 'err');
    }, 8000);
  };

  $('save').disabled = false;

  $('quit').onclick = function () { post({ type: 'web.quit' }); };

  // 输入框里回车 = 保存并重试
  $('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('save').click(); }
  });
  $('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('save').click(); }
  });

  if (!url) setTimeout(function () { $('url').focus(); }, 120);
})();
</script>
</body>
</html>
